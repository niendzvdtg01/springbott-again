name: TaskFlow CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: taskflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make maven wrapper executabnle
        run: chmod +x mvnw

      - name: Build run and tests
        run: ./mvnw --batch-mode verify

      - name: Build docker image
        run: docker build --tag taskflow-api:${{ github.sha }} .
