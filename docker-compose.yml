services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql_container
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: student_managing
      MYSQL_ROOT_PASSWORD: "1234"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["executable", "arg"]
      interval: 5S
      timeout: 5S
      retries: 15
      start_period: 20s

  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL}
    
volumes:
  mysql_data:
